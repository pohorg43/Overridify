name: Build & Package Module

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
    tags: ['v*']
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_FALLBACK_VERSION: r27c
      API_LEVEL: 23

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate or install Android NDK
        run: |
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "${ANDROID_NDK_LATEST_HOME}" ]; then
            echo "Using pre-installed NDK: ${ANDROID_NDK_LATEST_HOME}"
            echo "NDK_ROOT=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"
          else
            echo "Downloading Android NDK ${NDK_FALLBACK_VERSION}..."
            wget -q "https://dl.google.com/android/repository/android-ndk-${NDK_FALLBACK_VERSION}-linux.zip" -O ndk.zip
            unzip -q ndk.zip
            echo "NDK_ROOT=$PWD/android-ndk-${NDK_FALLBACK_VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Generate compiled AWK reference database
        run: |
          python3 .github/scripts/gen_aosp_awk.py
          test -s common/database/aosp_reference.awk

      - name: Compile native ARM64 binaries
        run: |
          CC="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${API_LEVEL}-clang"
          $CC --version

          $CC -O3 -Wall -s src/overridify-scan.c -lz -o bin/overridify-scan
          $CC -O3 -Wall -s src/mali-patcher.c -o bin/mali-patcher

          chmod 0755 bin/overridify-scan bin/mali-patcher bin/overridify bin/mawk uninstall.sh
          readelf -h -d bin/overridify-scan
          readelf -h -d bin/mali-patcher

      - name: Package flashable module ZIP
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d= -f2)
          ZIP_NAME="Overridify-${VERSION}.zip"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

          zip -r9 "${ZIP_NAME}" \
            module.prop \
            customize.sh \
            uninstall.sh \
            skip_mount \
            skip_mountify \
            bin/overridify \
            bin/overridify-scan \
            bin/mawk \
            bin/mali-patcher \
            common/ \
            -x "common/database/aosp_reference.sh"

          unzip -l "${ZIP_NAME}"
          unzip -t "${ZIP_NAME}"
          ! unzip -l "${ZIP_NAME}" | grep -q "aosp_reference.sh"
          unzip -l "${ZIP_NAME}" | grep -q "aosp_reference.awk"

      - name: Upload native binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: overridify-native-binaries-arm64
          path: |
            bin/overridify-scan
            bin/mali-patcher

      - name: Upload flashable module ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Overridify-${{ env.VERSION }}
          path: ${{ env.ZIP_NAME }}

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ZIP_NAME}" --clobber
          else
            gh release create "${TAG}" "${ZIP_NAME}" \
              --title "Overridify ${TAG}" \
              --generate-notes
          fi
